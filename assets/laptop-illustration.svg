<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="laptopTitle">
  <title id="laptopTitle">Illustration of a learner studying on a laptop</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF8D6"/>
      <stop offset="1" stop-color="#C9EFA0"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C9A6"/>
      <stop offset="1" stop-color="#E9AE84"/>
    </linearGradient>
    <linearGradient id="shirt2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="210" r="190" fill="url(#bg2)"/>

  <g fill="#7ED321">
    <path d="M62 140l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="M356 120l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <circle cx="350" cy="290" r="6"/>
  </g>

  <!-- body -->
  <path d="M110 330c0-56 44-92 100-92s100 36 100 92v20H110z" fill="url(#shirt2)"/>
  <path d="M190 232h40v16c0 11-9 20-20 20s-20-9-20-20z" fill="#D89A72"/>

  <!-- head -->
  <ellipse cx="210" cy="150" rx="66" ry="74" fill="url(#skin2)"/>
  <circle cx="146" cy="156" r="12" fill="#E9AE84"/>
  <circle cx="274" cy="156" r="12" fill="#E9AE84"/>
  <path d="M144 142c-2-56 32-90 78-88 44 2 70 34 68 82-14-22-28-36-50-40-10 18-26 28-46 30-14 2-34 6-50 16z" fill="#1E1E1E"/>
  <path d="M170 126c10-8 22-8 32-2" fill="none" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round"/>
  <path d="M220 124c10-6 22-6 32 2" fill="none" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="186" cy="154" rx="7" ry="9" fill="#1E1E1E"/>
  <ellipse cx="236" cy="154" rx="7" ry="9" fill="#1E1E1E"/>
  <circle cx="189" cy="150" r="2.5" fill="#fff"/>
  <circle cx="239" cy="150" r="2.5" fill="#fff"/>
  <path d="M190 188c12 12 30 12 42 0" fill="none" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round"/>

  <!-- laptop -->
  <g>
    <path d="M118 330h184a8 8 0 0 1 8 8v4H110v-4a8 8 0 0 1 8-8z" fill="#CFD8DC"/>
    <path d="M128 262h164a10 10 0 0 1 10 10v58H118v-58a10 10 0 0 1 10-10z" fill="#37474F"/>
    <rect x="130" y="272" width="160" height="50" rx="4" fill="#7ED321"/>
    <g stroke="#0E1A0A" stroke-width="5" stroke-linecap="round" opacity=".8">
      <line x1="148" y1="288" x2="196" y2="288"/>
      <line x1="148" y1="302" x2="226" y2="302"/>
      <line x1="236" y1="288" x2="272" y2="288"/>
    </g>
  </g>

  <!-- hands on keyboard -->
  <ellipse cx="160" cy="330" rx="18" ry="12" fill="url(#skin2)"/>
  <ellipse cx="260" cy="330" rx="18" ry="12" fill="url(#skin2)"/>
</svg>
