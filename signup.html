<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7ED321" />
  <title>Create your account — ClassIQ</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="logo" aria-label="ClassIQ home">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#7ED321"/>
          <path d="M18 44 L26 18 L32 36 L38 18 L46 44" fill="none" stroke="#0E1A0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="32" cy="46" r="3.5" fill="#0E1A0A"/>
        </svg>
        <span>ClassIQ</span>
      </a>
      <nav class="navbar__nav" aria-label="Primary">
        <a href="index.html" class="nav-link">Home</a>
        <a href="courses.html" class="nav-link">Courses</a>
      </nav>
      <div class="navbar__actions">
        <a href="signin.html" class="btn btn--dark btn--sm">Login</a>
        <a href="signup.html" class="btn btn--primary btn--sm" aria-current="page">Signup</a>
      </div>
      <button class="icon-btn navbar__burger" id="burger" aria-label="Open menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
    </div>
  </header>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__panel">
      <div class="drawer__head">
        <a href="index.html" class="logo">
          <svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#7ED321"/>
            <path d="M18 44 L26 18 L32 36 L38 18 L46 44" fill="none" stroke="#0E1A0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="46" r="3.5" fill="#0E1A0A"/>
          </svg>
          <span>ClassIQ</span>
        </a>
        <button class="icon-btn" id="drawer-close" aria-label="Close menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 5.7 18.3 4.3 16.9 10.6 12 4.3 5.7 5.7 4.3l4.9 4.9 5.1-5.1z"/></svg>
        </button>
      </div>
      <nav class="drawer__nav" aria-label="Mobile">
        <a href="index.html" class="nav-link">Home</a>
        <a href="courses.html" class="nav-link">Courses</a>
      </nav>
      <div class="drawer__actions">
        <a href="signin.html" class="btn btn--dark btn--block">Login</a>
        <a href="signup.html" class="btn btn--primary btn--block">Signup</a>
      </div>
    </div>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <h1>SignUp</h1>
      <p class="auth-card__sub">Create your free account and start learning today.</p>

      <div class="alert alert--success" id="signup-success" role="status" hidden>
        Account created — taking you to login…
      </div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter Your Email" autocomplete="email" autofocus />
          <p class="field-error" data-error-for="email" hidden></p>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter Your Username" autocomplete="username" />
          <p class="field-error" data-error-for="username" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Enter Your Password" autocomplete="new-password" />
            <button type="button" class="icon-btn password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C5 5 1 12 1 12s4 7 11 7 11-7 11-7-4-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M12 5c-7 0-11 7-11 7s4 7 11 7c1.5 0 2.9-.3 4.1-.8l1.9 1.9 1.4-1.4-2.4-2.4C18.7 14.4 21.6 12 23 12s-4-7-11-7zm9.8 7c-1.3 1.7-3.6 4-6.5 5l-1.7-1.7A4.5 4.5 0 0 0 12 16.5 4.5 4.5 0 0 1 8.4 9.9L6.4 7.9C3.6 9 1.3 11.3 0 12c1.4-1.9 4.4-5.5 9.4-6.7L12 7.9l2.6-2.6c5 1.2 8 4.8 9.4 6.7-.6.8-1.5 1.7-2.2 2zM12 9a3 3 0 0 0-2.9 3.9l-1.5-1.5A4.5 4.5 0 0 1 12 7.5c.5 0 1 .1 1.4.2L12 9z"/></svg>
            </button>
          </div>
          <p class="field-error" data-error-for="password" hidden></p>
        </div>

        <div class="strength" id="strength-wrap" aria-live="polite" hidden>
          <div class="strength__bar"><span id="strength-fill"></span></div>
          <p class="strength__label">Password strength: <span id="strength-text"></span></p>
        </div>

        <button type="submit" class="btn btn--primary btn--lg btn--block" id="signup-btn">Signup</button>
      </form>

      <p class="auth-card__footer">Already have an account? <a href="signin.html">Login</a></p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
